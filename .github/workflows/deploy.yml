name: Deploy to server
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-main
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::518761466259:role/summit-sites-github-actions-deploy
          aws-region: us-east-2
      - name: Deploy "simpleciso" via SSM
        run: |
          set -euo pipefail
          SITE=simpleciso
          INST=i-059c1aa299becf3c1
          CMD=$(aws ssm send-command --region us-east-2 \
            --instance-ids "$INST" --document-name AWS-RunShellScript \
            --comment "deploy $SITE ${GITHUB_SHA::7}" \
            --parameters commands="/usr/local/bin/summit-deploy-site.sh $SITE" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD"
          for i in $(seq 1 72); do
            S=$(aws ssm get-command-invocation --region us-east-2 --command-id "$CMD" --instance-id "$INST" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $S"
            case "$S" in
              Success) echo "::group::deploy output"; aws ssm get-command-invocation --region us-east-2 --command-id "$CMD" --instance-id "$INST" --query StandardOutputContent --output text | tail -25; echo "::endgroup::"; exit 0;;
              Failed|Cancelled|TimedOut) echo "DEPLOY $S"; aws ssm get-command-invocation --region us-east-2 --command-id "$CMD" --instance-id "$INST" --query StandardErrorContent --output text; aws ssm get-command-invocation --region us-east-2 --command-id "$CMD" --instance-id "$INST" --query StandardOutputContent --output text | tail -30; exit 1;;
            esac
            sleep 5
          done
          echo "timed out waiting for SSM"; exit 1
